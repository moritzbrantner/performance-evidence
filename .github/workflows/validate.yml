name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@8669e7cad2233c0fb1e0fcc3e00a041d2b6d7b03
    with:
      operation: foundation
      install_mode: none
      report_path: .artifacts/coding-tooling/foundation.json

  findings:
    name: Deterministic findings
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@8669e7cad2233c0fb1e0fcc3e00a041d2b6d7b03
    with:
      operation: findings
      install_mode: none
      report_path: .artifacts/coding-tooling/findings.json

  contract:
    name: Repository validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@8669e7cad2233c0fb1e0fcc3e00a041d2b6d7b03
    with:
      operation: run
      tier: fast
      report_path: .artifacts/coding-tooling/fast.json
      evidence_path: .artifacts/performance-evidence/contract-validation.json
      artifact_retention_days: 14

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["foundation", "findings", "contract"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["foundation", "findings", "contract"]'
